[package]
name = "filmcraft-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The native wgpu backends (Metal, Vulkan, Direct3D 12, OpenGL). Without them the off-screen
# export renderer has no adapter to open. The desktop app gets them through eframe; the CLI asks
# for them here, so `cargo build -p filmcraft-cli` composites exports on the GPU too (#799).
backends = ["wgpu/metal", "wgpu/vulkan", "wgpu/dx12", "wgpu/gles"]

[dependencies]
filmcraft-color = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-geom = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "0.4"
rayon = { workspace = true }

[dev-dependencies]
pollster = "0.4"
filmcraft-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
filmcraft-media = { workspace = true }
filmcraft-time = { workspace = true }
